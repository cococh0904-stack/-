<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 校園導師小幫手</title>
<style>
:root{--blue:#2864dc;--pale:#edf4ff;--ink:#1c2b45;--muted:#6b7890;--line:#dce5f2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f5f8ff,#eaf2ff);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
.app{width:min(900px,100%);height:min(820px,calc(100vh - 40px));min-height:600px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 55px #244b8b18;display:flex;flex-direction:column;overflow:hidden}
header{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:15px;background:var(--pale);display:grid;place-items:center;font-size:24px}h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:13px}
.settings{padding:14px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #edf1f7}.settings label{font-size:13px;color:var(--muted)}select{border:1px solid var(--line);border-radius:10px;padding:9px;background:white;color:var(--ink)}
.prompts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 0}.prompt{background:#f6f8fc;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:#36527c;cursor:pointer;font-size:13px}
#messages{padding:20px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}.msg{max-width:85%;padding:13px 16px;border-radius:17px;white-space:pre-wrap;line-height:1.65;font-size:14px}.bot{background:#f2f6fd;align-self:flex-start;border-bottom-left-radius:5px}.user{background:var(--blue);color:white;align-self:flex-end;border-bottom-right-radius:5px}.source{font-size:11px;color:var(--muted);margin-top:6px}
form{padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;gap:10px}input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;outline:none}input:focus{border-color:#7ba2f4}button.send{border:0;background:var(--blue);color:white;border-radius:14px;padding:0 22px;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.hint{text-align:center;color:var(--muted);font-size:11px;padding:0 12px 12px}
@media(max-width:600px){body{padding:0}.app{height:100vh;min-height:0;border-radius:0}.msg{max-width:94%}header{padding:18px}.settings,#messages{padding-left:16px;padding-right:16px}.prompts{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">🎓</div><div><h1>AI 校園導師小幫手</h1><p>陪你整理課業、學習方法與校園生活問題</p></div></header>
<div class="settings"><label for="mode">回答方式</label><select id="mode"><option value="auto">自動選擇（規則 → AI → 備援）</option><option value="rule">規則回答</option><option value="ai">Gemini AI 回答</option><option value="fallback">W03 備援回答</option></select></div>
<div class="prompts">
<button class="prompt" data-text="我不知道怎麼開始寫程式作業">程式作業</button>
<button class="prompt" data-text="我該怎麼安排考試讀書計畫？">讀書計畫</button>
<button class="prompt" data-text="我最近覺得壓力很大">壓力調適</button>
<button class="prompt" data-text="有哪些方法可以探索未來職涯？">未來職涯</button>
</div>
<section id="messages" aria-live="polite"><div class="msg bot">你好！我是 AI 校園導師小幫手。你可以選擇回答方式，或直接輸入想問的問題。<div class="source">系統提示</div></div></section>
<form id="chat-form"><input id="message" placeholder="輸入你的問題……" autocomplete="off" required><button class="send" id="send" type="submit">送出</button></form>
<div class="hint">回答僅供學習參考；學校正式規定請以校方公告為準。</div>
</main>
<script>
const API_BASE = "https://YOUR-RENDER-SERVICE.onrender.com";
const messages = document.getElementById("messages");
const input = document.getElementById("message");
const send = document.getElementById("send");
function addMessage(text, who, source) {
  const item = document.createElement("div");
  item.className = "msg " + who;
  item.textContent = text;
  if (source) {
    const meta = document.createElement("div");
    meta.className = "source";
    meta.textContent = "回答來源：" + source;
    item.appendChild(meta);
  }
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}
async function ask(text) {
  addMessage(text, "user");
  send.disabled = true; input.disabled = true;
  try {
    if (API_BASE.includes("YOUR-RENDER-SERVICE")) throw new Error("尚未設定後端網址");
    const response = await fetch(API_BASE + "/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text, mode:document.getElementById("mode").value})
    });
    const data = await response.json();
    addMessage(data.answer || "目前沒有收到回答，請稍後再試。", "bot", data.source || "備援");
  } catch (error) {
    addMessage("網站前端已完成，但尚未連接後端。請先部署 Render 後端，再把 index.html 裡的 API_BASE 改成 Render 網址。", "bot", "設定提醒");
  } finally { send.disabled = false; input.disabled = false; input.focus(); }
}
document.getElementById("chat-form").addEventListener("submit", e => {
  e.preventDefault(); const text = input.value.trim(); if (!text) return; input.value = ""; ask(text);
});
document.querySelectorAll(".prompt").forEach(btn => btn.addEventListener("click", () => ask(btn.dataset.text)));
</script>
</body>
</html>
